name: Trace Data
description: 'Trace Data (tracedata.io) was a data-security startup founded by James
  Donelan that built a platform integrating data observability, privacy, and security
  to track when and where company data is accessed as it moves across APIs, SaaS,
  and cloud, backed by venture investors including Accel. The company appears defunct:
  its website has been offline since after April 2021, and the tracedata.io DNS zone
  is now served by Netskope nameservers. No public API, developer portal, documentation,
  SDKs, or GitHub surface remains.'
